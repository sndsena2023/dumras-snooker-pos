<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สั่งอาหาร - ดำรัส สนุ๊กเกอร์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; padding-bottom: 90px; }
        
        /* ซ่อน Scrollbar ของแถบเมนูหมวดหมู่ แต่ยังเลื่อนได้ */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* อนิเมชั่นปุ่มเด้ง */
        .btn-bounce:active { transform: scale(0.95); transition: transform 0.1s; }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header สไตล์แอป -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white pt-6 pb-4 px-5 shadow-lg rounded-b-[2rem] sticky top-0 z-30">
        <div class="flex items-center gap-3 mb-2">
            <img src="icon-512.png" alt="โลโก้" class="w-12 h-12 object-contain bg-white rounded-full p-1 shadow-md">
            <div>
                <h1 class="font-bold text-xl leading-none">ดำรัส สนุ๊กเกอร์</h1>
                <p class="text-blue-100 text-sm opacity-90">บริการสั่งอาหารที่โต๊ะ</p>
            </div>
        </div>
        <div class="bg-white/20 backdrop-blur-md rounded-xl p-2 mt-3 flex items-center justify-center gap-2 border border-white/30">
            <span class="text-xl">🎱</span>
            <span class="font-bold" id="table-display">กำลังเช็คหมายเลขโต๊ะ...</span>
        </div>
    </header>

    <!-- แถบหมวดหมู่สินค้า (เลื่อนซ้าย-ขวาได้) -->
    <nav class="flex gap-2 overflow-x-auto px-4 py-4 hide-scrollbar sticky top-[120px] bg-[#f8fafc] z-20 shadow-sm" id="category-nav">
        <!-- ใส่หมวดหมู่โดย JS -->
    </nav>

    <!-- รายการสินค้า -->
    <main class="px-4 mt-2" id="product-list">
        <div class="flex flex-col items-center justify-center mt-10 text-gray-400">
            <div class="animate-spin text-3xl mb-2">⏳</div>
            <p>กำลังโหลดเมนูความอร่อย...</p>
        </div>
    </main>

    <!-- แถบตะกร้าลอยด้านล่าง -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] flex justify-between items-center transition-transform transform translate-y-full z-40 rounded-t-3xl border-t border-gray-100">
        <div class="flex items-center gap-3">
            <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-inner relative">
                🛒
                <span id="cart-qty-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white shadow">0</span>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-medium">ราคารวม</p>
                <p class="font-bold text-xl text-gray-800 leading-none">฿<span id="cart-price-total">0</span></p>
            </div>
        </div>
        <button onclick="openConfirmModal()" class="btn-bounce bg-blue-600 text-white font-bold py-3 px-6 rounded-2xl shadow-md shadow-blue-200">ดูตะกร้า ➔</button>
    </div>

    <!-- Popup ยืนยันการสั่ง (ตะกร้า) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex flex-col justify-end">
        <div class="bg-white rounded-t-[2rem] p-6 w-full max-h-[85vh] flex flex-col animate-[slideUp_0.3s_ease-out]">
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h2 class="text-2xl font-bold text-gray-800">🍽️ ตะกร้าของคุณ</h2>
                <button onclick="closeConfirmModal()" class="bg-gray-100 w-8 h-8 rounded-full text-gray-500 font-bold hover:bg-gray-200 flex items-center justify-center">✕</button>
            </div>
            
            <div id="cart-items-review" class="flex-1 overflow-y-auto space-y-3 mb-6 pr-2"></div>
            
            <div class="border-t border-gray-100 pt-5 shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-500">ยอดชำระทั้งหมด</span>
                    <span class="font-bold text-2xl text-blue-600">฿<span id="review-total-price">0</span></span>
                </div>
                <button onclick="submitOrder()" class="btn-bounce w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-200 flex justify-center items-center gap-2 text-lg">
                    ✅ ยืนยันส่งออเดอร์
                </button>
            </div>
        </div>
    </div>

    <!-- Popup ออเดอร์สำเร็จ -->
    <div id="success-modal" class="hidden fixed inset-0 z-[60] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="w-32 h-32 bg-green-100 rounded-full flex items-center justify-center text-6xl mb-6 shadow-inner animate-bounce">🎉</div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">ส่งออเดอร์แล้ว!</h2>
        <p class="text-gray-500 mb-10 text-lg">พนักงานได้รับออเดอร์ของคุณแล้ว<br>กรุณารอสักครู่นะครับ</p>
        <button onclick="location.reload()" class="btn-bounce w-full max-w-xs bg-gray-100 text-gray-700 font-bold py-4 rounded-2xl shadow-sm border border-gray-200">← กลับไปสั่งอาหารเพิ่ม</button>
    </div>

    <script>
        // --- 1. ตั้งค่า Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyD3_M85acXiPsrDNzvzHOPPW9cjRsL2NRk",
            authDomain: "dumras-snooker-pos.firebaseapp.com",
            projectId: "dumras-snooker-pos",
            storageBucket: "dumras-snooker-pos.firebasestorage.app",
            messagingSenderId: "985526889212",
            appId: "1:985526889212:web:f4c71ad06b838cf9748579"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. อ่านค่า โต๊ะ จาก URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const tableId = urlParams.get('table');
        
        const tableNames = { "N1":"โต๊ะ 1", "N2":"โต๊ะ 2", "N3":"โต๊ะ 3", "N4":"โต๊ะ 4", "V1":"VIP 1", "V2":"VIP 2", "V3":"VIP 3" };
        const tableName = tableNames[tableId] || tableId;

        if (!tableId) {
            document.getElementById("table-display").innerText = "⚠️ ไม่พบข้อมูลโต๊ะ";
            document.getElementById("table-display").classList.replace("text-white", "text-red-200");
        } else {
            document.getElementById("table-display").innerText = `กำลังนั่งอยู่ที่: ${tableName}`;
        }

        // --- 3. ดึงเมนูอาหารและจัดการหมวดหมู่ ---
        let products = [];
        let cart = {}; 
        let currentFilter = 'all';

        const catIcons = { "snack": "🍟", "water": "💧", "softdrink": "🥤", "alcohol": "🍺" };
        const catNames = { "snack": "อาหาร/ขนม", "water": "น้ำดื่ม", "softdrink": "น้ำอัดลม", "alcohol": "แอลกอฮอล์" };

        db.collection("system").doc("products").get().then(doc => {
            if (doc.exists) {
                products = doc.data().list;
                renderCategoryNav();
                renderProducts();
            } else {
                document.getElementById("product-list").innerHTML = '<p class="text-center text-red-400 mt-10">ยังไม่มีเมนูอาหารในระบบ</p>';
            }
        });

        function renderCategoryNav() {
            const categories = ['all', ...new Set(products.map(p => p.category))];
            let html = '';
            
            categories.forEach(cat => {
                const isActive = currentFilter === cat;
                const activeClass = isActive ? "bg-blue-600 text-white shadow-md border-blue-600" : "bg-white text-gray-600 border-gray-200 hover:bg-gray-50";
                const icon = cat === 'all' ? "🍽️" : (catIcons[cat] || "✨");
                const name = cat === 'all' ? "ทั้งหมด" : (catNames[cat] || cat);
                
                html += `
                    <button onclick="setFilter('${cat}')" class="flex items-center gap-1.5 px-4 py-2 rounded-full border text-sm font-medium whitespace-nowrap transition-all ${activeClass}">
                        <span>${icon}</span> ${name}
                    </button>
                `;
            });
            document.getElementById("category-nav").innerHTML = html;
        }

        function setFilter(cat) {
            currentFilter = cat;
            renderCategoryNav();
            renderProducts();
        }

        function renderProducts() {
            let html = '<div class="space-y-4">'; // ใช้แนวตั้งแบบ Card ยาว
            
            const filteredProducts = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);
            
            if(filteredProducts.length === 0) {
                html += `<div class="text-center text-gray-400 py-10">ไม่พบเมนูในหมวดหมู่นี้</div>`;
            }

            filteredProducts.forEach(p => {
                const qty = cart[p.id] || 0;
                const icon = catIcons[p.category] || "🛍️";
                
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-4 transition-transform ${qty>0 ? 'border-blue-200 bg-blue-50/30' : ''}">
                        <!-- ไอคอน/รูปภาพจำลอง -->
                        <div class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center text-3xl shadow-inner shrink-0">
                            ${icon}
                        </div>
                        
                        <!-- รายละเอียด -->
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 leading-tight mb-1">${p.name}</h3>
                            <p class="text-blue-600 font-bold text-sm">฿${p.price}</p>
                        </div>
                        
                        <!-- ปุ่มเพิ่มลด -->
                        <div class="shrink-0">
                            ${qty === 0 ? 
                                `<button onclick="updateCart('${p.id}', 1)" class="btn-bounce bg-blue-50 text-blue-600 font-bold w-10 h-10 rounded-full flex items-center justify-center shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                </button>` 
                                : 
                                `<div class="flex items-center bg-white border border-blue-200 rounded-full p-1 shadow-sm">
                                    <button onclick="updateCart('${p.id}', -1)" class="btn-bounce w-8 h-8 flex items-center justify-center bg-gray-50 rounded-full text-gray-600 font-bold">-</button>
                                    <span class="w-8 text-center font-bold text-blue-600">${qty}</span>
                                    <button onclick="updateCart('${p.id}', 1)" class="btn-bounce w-8 h-8 flex items-center justify-center bg-blue-600 rounded-full text-white font-bold">+</button>
                                </div>`
                            }
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById("product-list").innerHTML = html;
        }

        // --- 4. ระบบตะกร้า ---
        function updateCart(pId, change) {
            // สั่นมือถือเล็กน้อยเมื่อกดปุ่ม (ถ้าเบราว์เซอร์รองรับ)
            if (navigator.vibrate) navigator.vibrate(50); 
            
            if (!cart[pId]) cart[pId] = 0;
            cart[pId] += change;
            if (cart[pId] <= 0) delete cart[pId];
            
            renderProducts(); 
            updateCartBar();
        }

        function updateCartBar() {
            let totalQty = 0;
            let totalPrice = 0;
            
            for (let id in cart) {
                const product = products.find(p => p.id === id);
                totalQty += cart[id];
                totalPrice += product.price * cart[id];
            }
            
            document.getElementById("cart-qty-badge").innerText = totalQty;
            document.getElementById("cart-price-total").innerText = totalPrice;
            document.getElementById("review-total-price").innerText = totalPrice;
            
            const bar = document.getElementById("cart-bar");
            if (totalQty > 0) {
                bar.classList.remove("translate-y-full");
            } else {
                bar.classList.add("translate-y-full");
                closeConfirmModal(); // ปิดตะกร้าถ้าของหมด
            }
        }

        function openConfirmModal() {
            if(Object.keys(cart).length === 0) return;
            
            const reviewDiv = document.getElementById("cart-items-review");
            let html = '';
            for (let id in cart) {
                const p = products.find(prod => prod.id === id);
                const icon = catIcons[p.category] || "🛍️";
                html += `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                        <div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center text-xl shrink-0">${icon}</div>
                        <div class="flex-1">
                            <p class="font-bold text-sm text-gray-800 leading-tight">${p.name}</p>
                            <p class="text-xs text-gray-500 mt-0.5">฿${p.price} <span class="mx-1">✕</span> <span class="font-bold text-gray-700">${cart[id]}</span></p>
                        </div>
                        <p class="font-bold text-blue-600 text-lg shrink-0">฿${p.price * cart[id]}</p>
                    </div>
                `;
            }
            reviewDiv.innerHTML = html;
            document.getElementById("confirm-modal").classList.remove("hidden");
        }

        function closeConfirmModal() { document.getElementById("confirm-modal").classList.add("hidden"); }

        // --- 5. ส่งออเดอร์เข้า Cloud ---
        function submitOrder() {
            if(!tableId) {
                alert("กรุณาสแกน QR Code ของโต๊ะอีกครั้ง");
                return;
            }

            const btn = event.currentTarget;
            btn.innerHTML = `<span class="animate-spin text-xl">⏳</span> กำลังส่ง...`;
            btn.disabled = true;

            const orderItems = [];
            for (let id in cart) {
                const p = products.find(prod => prod.id === id);
                orderItems.push({ detail: p, qty: cart[id] });
            }

            db.collection("incoming_orders").add({
                tableId: tableId,
                tableName: tableName,
                items: orderItems,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeConfirmModal();
                document.getElementById("cart-bar").classList.add("hidden");
                document.getElementById("success-modal").classList.remove("hidden");
                cart = {}; 
                
                // สั่นแบบ Success (สั่น 2 ที)
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
            }).catch(e => {
                btn.innerHTML = `✅ ยืนยันส่งออเดอร์`;
                btn.disabled = false;
                alert("เกิดข้อผิดพลาดในการส่งออเดอร์ กรุณาเช็คอินเทอร์เน็ต");
            });
        }
    </script>
</body>
</html>
